services:
  - type: web
    name: ward360-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173
